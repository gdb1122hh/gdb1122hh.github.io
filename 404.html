<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 星河迷航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#050714;
  display:flex;justify-content:center;align-items:center;
  font-family:'Segoe UI',system-ui,sans-serif;
  overflow:hidden;
  perspective:1200px;
}
.scene{
  position:relative;
  width:500px;height:380px;
  transform-style:preserve-3d;
  transform:rotateX(0deg) rotateY(0deg);
  transition:transform .15s ease-out;
  cursor:grab;
}
.scene:active{cursor:grabbing}

/* 3D 星空粒子 */
.particles{position:absolute;inset:0;transform-style:preserve-3d}
.particle{
  position:absolute;
  width:3px;height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 6px rgba(255,255,255,.8);
  animation:twinkle 3s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.2;transform:scale(.6)}100%{opacity:1;transform:scale(1.4)}}

/* 404 主体 - 3D层叠 */
.layer{
  position:absolute;
  left:50%;top:50%;
  transform-style:preserve-3d;
  text-align:center;
}
.err-text{
  font-size:170px;font-weight:900;
  letter-spacing:18px;
  background:linear-gradient(135deg,#7b68ee,#00d4ff,#ff6ec7,#7b68ee);
  background-size:300% 300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradientShift 5s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(123,104,238,.4));
  transform:translate(-50%,-60%);
}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* 多层阴影制造3D厚度 */
.err-shadow{
  font-size:170px;font-weight:900;
  letter-spacing:18px;
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-60%) translateZ(-1px);
  color:rgba(123,104,238,.15);
}
.err-shadow2{
  font-size:170px;font-weight:900;
  letter-spacing:18px;
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-60%) translateZ(-3px);
  color:rgba(100,80,200,.08);
}
.err-shadow3{
  font-size:170px;font-weight:900;
  letter-spacing:18px;
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-60%) translateZ(-6px);
  color:rgba(80,60,180,.05);
}

.subtitle{
  font-size:22px;
  color:#a8b5e0;
  letter-spacing:8px;
  font-weight:300;
  transform:translate(-50%,40px);
  text-shadow:0 0 20px rgba(168,181,224,.3);
}
.message{
  font-size:16px;
  color:#7a8bb5;
  line-height:2;
  transform:translate(-50%,100px);
  white-space:nowrap;
}

/* 按钮 - 3D浮起 */
.btn-wrap{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,180px) translateZ(20px);
}
.btn-home{
  display:inline-block;
  padding:14px 48px;
  background:linear-gradient(135deg,#7b68ee,#5a4bd1);
  color:white;
  text-decoration:none;
  border-radius:30px;
  font-size:16px;font-weight:500;
  letter-spacing:3px;
  transition:all .3s ease;
  box-shadow:0 8px 25px rgba(123,104,238,.4), 0 0 60px rgba(123,104,238,.15);
  border:none;cursor:pointer;
  position:relative;
  overflow:hidden;
}
.btn-home::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);
  border-radius:30px;
}
.btn-home:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 14px 40px rgba(123,104,238,.6),0 0 80px rgba(123,104,238,.25);
}

/* 行星装饰 */
.planet{
  position:absolute;
  border-radius:50%;
  transform-style:preserve-3d;
}
.planet1{
  width:50px;height:50px;
  background:radial-gradient(circle at 30% 30%,#ff9a56,#cc5500);
  top:-20px;right:-30px;
  box-shadow:0 0 30px rgba(255,154,86,.4);
  animation:orbit1 20s linear infinite;
}
.planet2{
  width:30px;height:30px;
  background:radial-gradient(circle at 30% 30%,#56ccf2,#2a7fff);
  bottom:40px;left:-40px;
  box-shadow:0 0 20px rgba(86,204,242,.4);
  animation:orbit2 15s linear infinite;
}
.planet3{
  width:18px;height:18px;
  background:radial-gradient(circle at 30% 30%,#f2c94c,#f2994a);
  top:60%;right:-15px;
  box-shadow:0 0 15px rgba(242,201,76,.4);
  animation:orbit3 12s linear infinite;
}
@keyframes orbit1{0%{transform:rotateY(0) translateX(0)}100%{transform:rotateY(360deg) translateX(0)}}
@keyframes orbit2{0%{transform:rotateY(0) translateX(0)}100%{transform:rotateY(-360deg) translateX(0)}}
@keyframes orbit3{0%{transform:rotateY(0) translateX(0)}100%{transform:rotateY(360deg) translateX(0)}}

/* 流星 */
.shooting-star{
  position:absolute;
  width:3px;height:3px;
  background:linear-gradient(to right,transparent,white);
  border-radius:50%;
  animation:shoot 4s ease-in infinite;
  filter:blur(.5px);
}
@keyframes shoot{
  0%{transform:translate(0,0) rotate(-45deg);opacity:1}
  60%{opacity:1}
  100%{transform:translate(-350px,350px) rotate(-45deg);opacity:0}
}

/* 提示 */
.hint{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  color:#556688;font-size:13px;letter-spacing:2px;
  opacity:.6;animation:fadeInOut 3s ease-in-out infinite;
}
@keyframes fadeInOut{0%,100%{opacity:.3}50%{opacity:.8}}

/* 星云背景 */
.nebula{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 600px 400px at 20% 30%,rgba(123,104,238,.08),transparent),
    radial-gradient(ellipse 500px 500px at 80% 70%,rgba(0,212,255,.06),transparent),
    radial-gradient(ellipse 400px 300px at 50% 50%,rgba(255,110,199,.05),transparent);
}

/* 响应式 */
@media(max-width:600px){
  .scene{width:340px;height:300px}
  .err-text,.err-shadow,.err-shadow2,.err-shadow3{font-size:110px;letter-spacing:10px}
  .subtitle{font-size:17px;letter-spacing:5px}
  .message{font-size:13px}
  .btn-home{padding:12px 36px;font-size:14px}
}
</style>
</head>
<body>

<div class="nebula"></div>

<div class="scene" id="scene">
  <!-- 星空粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 流星 -->
  <div class="shooting-star" style="top:60px;left:70%;animation-delay:0s"></div>
  <div class="shooting-star" style="top:140px;left:60%;animation-delay:2s;width:2px;height:2px"></div>
  <div class="shooting-star" style="top:200px;left:80%;animation-delay:3.5s;width:4px;height:4px"></div>

  <!-- 3D 层叠 404 -->
  <div class="layer">
    <div class="err-shadow3">404</div>
    <div class="err-shadow2">404</div>
    <div class="err-shadow">404</div>
    <div class="err-text">404</div>
  </div>

  <!-- 副标题 -->
  <div class="layer subtitle">✦ 星河迷航 ✦</div>

  <!-- 描述 -->
  <div class="layer message">
    你寻找的星球尚未被发现<br>
    或许它正藏在某颗星光背后
  </div>

  <!-- 按钮 -->
  <div class="btn-wrap">
    <a href="/" class="btn-home">返回首页</a>
  </div>

  <!-- 行星 -->
  <div class="planet planet1"></div>
  <div class="planet planet2"></div>
  <div class="planet planet3"></div>
</div>

<div class="hint">🖱️ 拖动旋转 · 滚轮缩放</div>

<script>
// ===== 生成星空粒子 =====
const container = document.getElementById('particles');
for(let i=0;i<150;i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random()*2.5 + 1;
  p.style.width = size+'px';
  p.style.height = size+'px';
  p.style.left = Math.random()*100+'%';
  p.style.top = Math.random()*100+'%';
  // 随机Z轴深度
  p.style.transform = `translateZ(${Math.random()*200-100}px)`;
  p.style.animationDelay = Math.random()*4+'s';
  p.style.animationDuration = (Math.random()*3+2)+'s';
  // 随机颜色
  const colors = ['#ffffff','#aaccff','#ffccaa','#ccddff','#ffe4b5'];
  p.style.background = colors[Math.floor(Math.random()*colors.length)];
  container.appendChild(p);
}

// ===== 3D 拖拽旋转 =====
const scene = document.getElementById('scene');
let isDragging = false, startX, startY, rotX = 0, rotY = 0, curX = 0, curY = 0;
let scale = 1, targetScale = 1;

scene.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  scene.style.transition = 'none';
});
window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  curY = rotY + dx * 0.4;
  curX = Math.max(-30, Math.min(30, rotX - dy * 0.3));
  updateTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  rotX = curX; rotY = curY;
  scene.style.transition = 'transform .15s ease-out';
});

// 触摸支持
scene.addEventListener('touchstart', e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  scene.style.transition = 'none';
});
window.addEventListener('touchmove', e => {
  if(!isDragging) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  curY = rotY + dx * 0.4;
  curX = Math.max(-30, Math.min(30, rotX - dy * 0.3));
  updateTransform();
});
window.addEventListener('touchend', () => {
  isDragging = false;
  rotX = curX; rotY = curY;
  scene.style.transition = 'transform .15s ease-out';
});

// 滚轮缩放
window.addEventListener('wheel', e => {
  targetScale -= e.deltaY * 0.001;
  targetScale = Math.max(0.6, Math.min(1.8, targetScale));
}, {passive:true});

// 平滑缩放动画
function animateScale(){
  scale += (targetScale - scale) * 0.08;
  updateTransform();
  requestAnimationFrame(animateScale);
}
animateScale();

function updateTransform(){
  scene.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg) scale(${scale})`;
}

// 自动缓慢旋转（空闲时）
let idleTimer;
function resetIdle(){clearTimeout(idleTimer)}
scene.addEventListener('mousedown', resetIdle);
setInterval(()=>{
  if(!isDragging){
    curY += 0.15;
    rotY = curY;
    updateTransform();
  }
}, 50);
</script>

</body>
</html>
