<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我 | 星空岛</title>
<style>
:root {

  --bg:#0d0a1a;--purple:#a78bfa;--purple-light:#c4b5fd;--pink:#ec4899;
  --text:#e8e0ff;--text-dim:#9ca3af;
  --card:rgba(30,25,60,0.7);--card-border:rgba(167,139,250,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6;cursor:none;}
#cursor-glow{position:fixed;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.15) 0%,transparent 70%);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
#cursor-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--purple);pointer-events:none;z-index:10000;transform:translate(-50%,-50%);box-shadow:0 0 8px var(--purple);}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(13,10,26,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(167,139,250,0.15);}
nav .logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
nav ul{display:flex;list-style:none;gap:8px;}
nav ul li a{display:block;padding:8px 18px;color:var(--text-dim);text-decoration:none;border-radius:8px;font-size:0.95rem;transition:all 0.3s;}
nav ul li a:hover{color:var(--purple-light);background:rgba(167,139,250,0.1);}
nav ul li a.active{color:#fff;background:linear-gradient(135deg,#6d28d9,var(--pink));box-shadow:0 4px 15px rgba(167,139,250,0.4);}

main{padding:100px 20px 40px;max-width:900px;margin:0 auto;}

.page-header{text-align:center;margin-bottom:50px;}
.page-header h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;background:linear-gradient(135deg,var(--purple-light),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-header p{color:var(--text-dim);margin-top:10px;}

/* 社交卡片 */
.social-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:50px;}
.social-card{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:36px 24px;background:var(--card);border:1px solid var(--card-border);
  border-radius:16px;backdrop-filter:blur(10px);transition:all 0.4s;cursor:none;
  text-decoration:none;color:var(--text);position:relative;overflow:hidden;
}
.social-card::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,0.03) 0%,transparent 60%);
  transform:scale(0);transition:transform 0.6s;
}
.social-card:hover::before{transform:scale(1);}
.social-card:hover{transform:translateY(-8px) scale(1.02);}
.social-card .icon{font-size:3rem;transition:transform 0.4s;}
.social-card:hover .icon{transform:scale(1.2) rotate(5deg);}
.social-card .name{font-size:1.2rem;font-weight:700;}
.social-card .handle{font-size:0.85rem;color:var(--text-dim);}
.social-card .btn{
  margin-top:6px;padding:8px 20px;border-radius:8px;font-size:0.85rem;
  background:rgba(167,139,250,0.15);color:var(--purple-light);
  border:1px solid var(--card-border);transition:all 0.3s;
}
.social-card:hover .btn{background:var(--purple);color:#fff;border-color:var(--purple);}

/* 各平台色 */
.social-card.bili:hover{border-color:#00a1d6;box-shadow:0 0 25px rgba(0,161,214,0.3);}
.social-card.kuaishou:hover{border-color:#ff4906;box-shadow:0 0 25px rgba(255,73,6,0.3);}
.social-card.douyin:hover{border-color:#ee1d52;box-shadow:0 0 25px rgba(238,29,82,0.3);}
.social-card.youtube:hover{border-color:#ff0000;box-shadow:0 0 25px rgba(255,0,0,0.35);}
.social-card.youtube .btn:hover{background:#ff0000;border-color:#ff0000;}

/* 联系信息 */
.info-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:30px;backdrop-filter:blur(10px);margin-bottom:30px;}
.info-card h3{font-size:1.1rem;margin-bottom:16px;color:var(--purple-light);}
.info-list{list-style:none;display:flex;flex-direction:column;gap:12px;}
.info-list li{display:flex;align-items:center;gap:10px;font-size:0.92rem;color:var(--text-dim);}
.info-list li .il-icon{font-size:1.2rem;width:28px;text-align:center;}
.info-list li .il-val{color:var(--text);}

/* 留言表单 */
.contact-form{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:30px;backdrop-filter:blur(10px);}
.contact-form h3{font-size:1.1rem;margin-bottom:16px;color:var(--purple-light);}
.contact-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.contact-form input,.contact-form textarea{
  width:100%;padding:12px 16px;border-radius:10px;
  border:1px solid var(--card-border);background:rgba(13,10,26,0.5);
  color:var(--text);font-size:0.92rem;outline:none;backdrop-filter:blur(10px);
}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--purple);box-shadow:0 0 10px rgba(167,139,250,0.2);}
.contact-form textarea{min-height:100px;resize:vertical;margin-bottom:12px;}
.contact-form button{
  padding:12px 32px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;font-size:0.95rem;font-weight:600;cursor:none;transition:all 0.3s;
}
.contact-form button:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(167,139,250,0.4);}

footer{text-align:center;padding:30px 20px;color:var(--text-dim);font-size:0.85rem;}

/* reveal 动画（可重复）*/
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s cubic-bezier(0.34,1.56,0.64,1);}
.reveal.in-view{opacity:1;transform:translateY(0);}

@media(max-width:768px){
  nav{padding:12px 16px;}nav ul li a{padding:6px 10px;font-size:0.85rem;}
  body{cursor:auto;}#cursor-glow,#cursor-dot{display:none;}
  .contact-form .row{grid-template-columns:1fr;}
}

/* 波纹动画 */
@keyframes ripple{to{width:300px;height:300px;opacity:0;}}
</style>
</head>
<body>
<div id="cursor-glow"></div><div id="cursor-dot"></div>

<nav>
  <div class="logo">StarryIsland | 星空岛</div>
  <ul>
    <li><a href="../">首页</a></li>
    <li><a href="../works/">作品</a></li>
    <li><a href="../about/">关于我</a></li>
    <li><a href="./" class="active">联系我</a></li>
    <li><a href="../about-site/">关于本站</a></li>
    <li><a href="../tools/">推荐工具</a></li>
  </ul>
</nav>

<main>
  <div class="page-header">
    <h1>联系我</h1>
    <p>来这些地方找我，不过我不一定在</p>
  </div>

  <div class="social-grid">
    <a href="https://space.bilibili.com/3546626148797356" target="_blank" rel="noopener" class="social-card bili">
      <div class="icon">📺</div>
      <div class="name">Bilibili</div>
      <div class="handle">@沉下去的黄昏</div>
      <div class="btn">前往关注 →</div>
    </a>
    <a href="https://v.kuaishou.com/KSqgoJpN" target="_blank" rel="noopener" class="social-card kuaishou">
      <div class="icon">⚡</div>
      <div class="name">快手</div>
      <div class="handle">@孤岛不沉没</div>
      <div class="btn">前往关注 →</div>
    </a>
    <a href="https://v.douyin.com/WWfcYDrP7pI/" target="_blank" rel="noopener" class="social-card douyin">
      <div class="icon">🎵</div>
      <div class="name">抖音</div>
      <div class="handle">@孤岛不沉没</div>
      <div class="btn">前往关注 →</div>
    </a>
    <a href="https://www.youtube.com/@%E5%AD%A4%E5%B2%9B%E4%B8%8D%E6%B2%89%E6%B2%A1" target="_blank" rel="noopener" class="social-card youtube">
      <div class="icon">▶️</div>
      <div class="name">YouTube</div>
      <div class="handle">@孤岛不沉没</div>
      <div class="btn">访问 YouTube →</div>
    </a>
  </div>

  <div class="info-card reveal">
    <h3>📋 联系信息</h3>
    <ul class="info-list">
      <li><span class="il-icon">📍</span><span>所在地：</span><span class="il-val">江西上饶</span></li>
      <li><span class="il-icon">📧</span><span>邮箱：</span><span class="il-val">3@9.com</span></li>
      <li><span class="il-icon">💬</span><span>QQ：</span><span class="il-val">1pm</span></li>
      <li><span class="il-icon">⏰</span><span>在线时间：</span><span class="il-val">不定时，看心情</span></li>
    </ul>
  </div>

  <div class="contact-form reveal">
    <h3>✉️ 给我留言</h3>
    <div class="row">
      <input id="cf-name" placeholder="你的名字" maxlength="12">
      <input id="cf-email" placeholder="你的邮箱（可不填）" maxlength="40">
    </div>
    <textarea id="cf-msg" placeholder="说点什么吧…" maxlength="300"></textarea>
    <button onclick="sendMsg()">发送留言 🚀</button>
  </div>
</main>

<footer>
  <p>© 2026 星空岛 ✦ 本站由 AI 辅助搭建 | 代码非纯手工</p>
</footer>

<script>
// 页面入场动画
document.addEventListener('DOMContentLoaded',()=>{
  document.body.style.opacity='0';
  requestAnimationFrame(()=>{
    document.body.style.transition='opacity 0.6s ease';
    document.body.style.opacity='1';
  });

  // 鼠标光晕跟随
  const glow=document.getElementById('cursor-glow');
  const dot=document.getElementById('cursor-dot');
  let mx=window.innerWidth/2,my=window.innerHeight/2;
  let gx=mx,gy=my,dx=mx,dy=my;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  function loop(){
    gx+=(mx-gx)*0.12; gy+=(my-gy)*0.12;
    dx+=(mx-dx)*0.25; dy+=(my-dy)*0.25;
    if(glow) glow.style.left=gx+'px',glow.style.top=gy+'px';
    if(dot) dot.style.left=dx+'px',dot.style.top=dy+'px';
    requestAnimationFrame(loop);
  }
  loop();

  // 卡片点击波纹 + Toast
  const cards=document.querySelectorAll('.social-card');
  cards.forEach(c=>{
    c.addEventListener('click',function(e){
      const r=this.getBoundingClientRect();
      const sp=document.createElement('span');
      sp.style.cssText=`position:absolute;left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:0;height:0;border-radius:50%;background:rgba(167,139,250,0.35);transform:translate(-50%,-50%);animation:ripple 0.6s ease-out forwards;pointer-events:none;`;
      this.appendChild(sp);
      setTimeout(()=>sp.remove(),600);
      const name=this.querySelector('.name').textContent;
      showToast('正在前往 '+name+' …');
    });
  });

  // 复制链接按钮已移除（简化）

  // 留言表单
  window.sendMsg=function(){
    const name=document.getElementById('cf-name').value.trim();
    const msg=document.getElementById('cf-msg').value.trim();
    if(!msg){showToast('写点什么再发吧～');return;}
    const list=JSON.parse(localStorage.getItem('msgList')||'[]');
    list.unshift({name:name||'匿名',msg,time:Date.now()});
    localStorage.setItem('msgList',JSON.stringify(list));
    document.getElementById('cf-name').value='';
    document.getElementById('cf-msg').value='';
    showToast('留言已发送！（其实只有你自己看得到）');
    renderMsgs();
  };

  function renderMsgs(){
    let wrap=document.getElementById('msg-list');
    if(!wrap){wrap=document.createElement('div');wrap.id='msg-list';wrap.style.cssText='margin-top:20px;display:flex;flex-direction:column;gap:10px;';document.querySelector('.contact-form').appendChild(wrap);}
    const list=JSON.parse(localStorage.getItem('msgList')||'[]');
    wrap.innerHTML=list.slice(0,5).map(m=>`<div style="padding:12px 16px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.15);border-radius:10px;font-size:0.88rem;"><b style="color:var(--purple-light)">${m.name}</b>：${m.msg}</div>`).join('');
  }
  renderMsgs();

  // reveal 元素 IntersectionObserver（可重复播放）
  const revObs = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in-view'); }
      else { e.target.classList.remove('in-view'); }
    });
  },{threshold:0.2});
  document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));
});

// Toast
function showToast(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 24px;background:rgba(30,25,60,0.95);color:#fff;border:1px solid rgba(167,139,250,0.4);border-radius:10px;font-size:0.9rem;z-index:99999;opacity:0;transition:all 0.3s;backdrop-filter:blur(10px);';document.body.appendChild(el);}
  el.textContent=t;el.style.opacity='1';el.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(20px)';},2200);
}
</script>
</body>
</html>
